name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Reject private or large runtime files
        shell: pwsh
        run: |
          $pattern = '(^|/)\.env$|/config\.yaml$|cookies.*\.txt$|db_dump_.*\.sql$|\.(pt|onnx|engine)$|^reports/'
          $blocked = git ls-files | Select-String -Pattern $pattern
          if ($blocked) {
            $blocked
            throw "Private or large runtime files are tracked"
          }
      - name: Install test dependencies
        run: python -m pip install -r automation/requirements.txt
      - name: Run unit and architecture tests
        run: python -m unittest discover -s automation/tests -v
      - name: Compile Python sources
        run: python -m compileall -q automation highlight dashboard
